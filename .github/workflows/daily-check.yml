name: Daily flight check

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 7am NZDT (6am during NZ winter time)
  workflow_dispatch: # "Run workflow" button on GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Pacific/Auckland
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check fares and email new deals
        run: node check.mjs
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Save price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/sent.json data/places-cache.json dashboard.html
          git diff --cached --quiet || git commit -m "Daily check $(date +%F)"
          git push

      - name: Prepare dashboard
        run: mkdir _site && cp dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
